version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    container_name: grocery_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - grocery_network

  webserver:
    image: nginx:alpine
    container_name: grocery_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - grocery_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: grocery_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: grocery_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: grocery_user
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - grocery_network

  redis:
    image: redis:alpine
    container_name: grocery_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - grocery_network

networks:
  grocery_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
